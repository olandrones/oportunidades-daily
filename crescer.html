<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌱 incubadora · crescer</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-light: #334155;
  --border: #475569;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #06b6d4;
  --green: #4ade80;
  --yellow: #fbbf24;
  --pink: #f472b6;
  --red: #f87171;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.4;
  overflow: hidden;
}
header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
h1 {
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mapa {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
  font-family: monospace;
}
.mapa span { white-space: nowrap; }
.filtros {
  margin-left: auto;
  display: flex;
  gap: 4px;
  font-size: 12px;
}
.filtros button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
}
.filtros button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
.sync {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.sync .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
}
.sync.dirty .dot { background: var(--yellow); }
.sync.error .dot { background: var(--red); }

main.board {
  display: flex;
  gap: 8px;
  padding: 12px;
  height: calc(100vh - 56px);
  overflow-x: auto;
  align-items: flex-start;
}
.col {
  background: var(--surface);
  border-radius: var(--radius);
  min-width: 240px;
  width: 240px;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  box-shadow: var(--shadow);
}
.col-head {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
}
.col-head .count {
  background: var(--bg);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
}
.col-body {
  flex: 1;
  padding: 8px;
  overflow-y: auto;
  min-height: 60px;
}
.col-body.drag-over {
  background: rgba(6, 182, 212, 0.08);
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  font-style: italic;
  padding: 16px 4px;
  opacity: .5;
}

.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
  cursor: grab;
  transition: all 0.15s;
  position: relative;
}
.card:hover { border-color: var(--accent); }
.card:active { cursor: grabbing; }
.card.ghost { opacity: 0.3; }
.card.dragging { transform: rotate(2deg); box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.card .emoji { font-size: 18px; margin-right: 4px; }
.card .title { font-weight: 600; font-size: 13px; margin-bottom: 2px; word-break: break-word; }
.card .tagline { font-size: 11px; color: var(--muted); line-height: 1.3; }
.card .meta {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.card .badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.card .badge.hermes { background: rgba(244,114,182,.15); color: var(--pink); }
.card .badge.urgente { background: rgba(248,113,113,.15); color: var(--red); }
.card .badge.framework { background: rgba(251,191,36,.15); color: var(--yellow); }
.card .has-dir::after {
  content: '💡';
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 12px;
}

.containers-area {
  background: rgba(244,114,182,0.05);
  border: 1px dashed var(--pink);
  border-radius: var(--radius);
  min-width: 280px;
  width: 280px;
  max-height: 100%;
  display: flex;
  flex-direction: column;
}
.containers-area .head {
  padding: 10px 12px;
  border-bottom: 1px dashed var(--pink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--pink);
}
.containers-area .body {
  flex: 1;
  padding: 8px;
  overflow-y: auto;
}
.containers-area .body.drag-over {
  background: rgba(244,114,182,0.1);
}
.container {
  background: var(--bg);
  border: 1px solid var(--pink);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}
.container .name {
  font-size: 12px;
  font-weight: 600;
  color: var(--pink);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.container .name input {
  background: transparent;
  border: none;
  color: var(--pink);
  font-weight: 600;
  font-size: 12px;
  flex: 1;
  outline: none;
  font-family: inherit;
}
.container .cards-mini {
  min-height: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.container .mini-card {
  background: var(--surface);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.container .empty {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 4px;
  font-style: italic;
}
.add-container-btn {
  background: transparent;
  border: 1px dashed var(--pink);
  color: var(--pink);
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  width: 100%;
  margin-top: 6px;
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  border: none;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(6,182,212,.4);
  z-index: 100;
}
.fab:hover { transform: scale(1.05); }

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.modal h2 {
  font-size: 18px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal .field { margin-bottom: 12px; }
.modal label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.modal input[type=text], .modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}
.modal textarea { min-height: 70px; resize: vertical; }
.modal .actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
  flex-wrap: wrap;
}
.modal button {
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
}
.modal button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
.modal button.danger {
  background: var(--bg);
  color: var(--red);
  border-color: var(--red);
}
.updates-mini {
  list-style: none;
  margin-top: 6px;
}
.updates-mini li {
  font-size: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.updates-mini li:last-child { border: none; }
.updates-mini .date { color: var(--muted); font-family: monospace; font-size: 10px; min-width: 50px; }
.direcionamentos {
  list-style: none;
  margin-top: 6px;
}
.direcionamentos li {
  font-size: 12px;
  padding: 6px 8px;
  background: var(--bg);
  border-left: 3px solid var(--yellow);
  border-radius: 4px;
  margin-bottom: 4px;
  display: flex;
  gap: 8px;
}
.direcionamentos .ts { color: var(--muted); font-size: 10px; font-family: monospace; min-width: 90px; }

@media (max-width: 700px) {
  main.board { padding: 8px; gap: 6px; }
  .col { min-width: 200px; width: 200px; }
  .containers-area { min-width: 220px; width: 220px; }
  h1 { font-size: 16px; }
  .mapa { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>🌱 incubadora</h1>
  <div class="mapa"><span>🌱</span>→<span>💡</span>→<span>🔍</span>→<span>🧪</span>→<span>🛠️</span></div>
  <div class="filtros">
    <button class="active" data-filter="all">tudo</button>
    <button data-filter="desenvolver">só desenvolvendo</button>
  </div>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText">—</span></div>
</header>

<main class="board" id="board">
  <!-- colunas + containers rendered by JS -->
</main>

<button class="fab" id="fab" title="nova ideia">+</button>

<!-- Modal: card detail -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <h2 id="modalTitle">—</h2>
    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitle">
    </div>
    <div class="field">
      <label>Tagline (1 linha)</label>
      <input type="text" id="fTagline">
    </div>
    <div class="field">
      <label>Direcionamentos</label>
      <div class="direcionamentos" id="fDirList"></div>
    </div>
    <div class="field">
      <label>Novo direcionamento (pra onde crescer?)</label>
      <textarea id="fNewDir" placeholder="ex: validar pricing com 5 clínicas"></textarea>
    </div>
    <div class="field">
      <label>Updates</label>
      <ul class="updates-mini" id="fUpdates"></ul>
    </div>
    <div class="actions">
      <button class="danger" id="bDel">🗑️ arquivar</button>
      <button id="bCancel">cancelar</button>
      <button class="primary" id="bSave">💾 salvar</button>
    </div>
  </div>
</div>

<!-- Modal: new card -->
<div class="modal-bg" id="newBg">
  <div class="modal">
    <h2>💡 nova ideia</h2>
    <div class="field">
      <label>Emoji</label>
      <input type="text" id="nEmoji" placeholder="💡" maxlength="2" value="💡">
    </div>
    <div class="field">
      <label>Título</label>
      <input type="text" id="nTitle" placeholder="ex: app de música com IA">
    </div>
    <div class="field">
      <label>Tagline (1 linha)</label>
      <input type="text" id="nTag" placeholder="ex: campo harmônico visual no violão">
    </div>
    <div class="field">
      <label>Começa em</label>
      <select id="nCol" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;">
        <option value="semente">🌱 semente</option>
        <option value="ideia">💡 ideia</option>
        <option value="pesquisar">🔍 pesquisar</option>
        <option value="aprofundar">🧪 aprofundar</option>
        <option value="desenvolver">🛠️ desenvolver</option>
      </select>
    </div>
    <div class="actions">
      <button id="nCancel">cancelar</button>
      <button class="primary" id="nCreate">+ criar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
// ===== CONFIG =====
const BIN_ID = '6a2ee7c6da38895dfebf95d8';
const API_KEY = '$2a$10$g6jrm.ifugmyTO7nGzWKIue3Q4ypHTUTwrxhFciJF43NiplD8w9mG';
const BASE = 'https://api.jsonbin.io/v3';
const LS_KEY = 'crescer:incubadora:v1';

// ===== SEED (4 cards atuais) =====
const SEED = () => ({
  version: '2.0',
  updated_at: new Date().toISOString(),
  columns: [
    { id: 'semente', label: '🌱 semente', cards: [
      { id: 'c1', emoji: '🎸', title: 'App Violão', tagline: 'campos harmônicos visuais no braço + MIDI', autor: 'renato', tags: [], direcionamentos: [{ ts: '2026-06-12T18:00:00Z', texto: 'demo sáb-dom', status: 'pendente' }], updates: [{ ts: '2026-06-12T18:00:00Z', tipo: 'scaffold', texto: 'conceito materializado' }] },
      { id: 'c2', emoji: '🦷', title: 'Clínica Chatbot', tagline: 'bot WhatsApp com RAG — atender 24/7', autor: 'renato', tags: ['urgente'], direcionamentos: [], updates: [{ ts: '2026-06-12T19:00:00Z', tipo: 'PRD', texto: 'PRD salvo 7.5KB' }, { ts: '2026-06-12T19:01:00Z', tipo: 'stack', texto: 'Node+Fastify+sqlite-vec+Evolution' }] },
      { id: 'c3', emoji: '🤿', title: 'Mergulho (framework)', tagline: '4 eixos + 5 validações', autor: 'hermes', tags: ['framework'], direcionamentos: [], updates: [{ ts: '2026-06-12T20:00:00Z', tipo: 'aplicado', texto: 'mergulho#1 = clínica' }] }
    ]},
    { id: 'ideia', label: '💡 ideia', cards: [
      { id: 'c4', emoji: '🤖', title: 'PM Skills / Agente-PM', tagline: 'agente cobre estratégia + operação + chat', autor: 'renato', tags: [], direcionamentos: [{ ts: '2026-06-11T10:00:00Z', texto: 'direção A: agente-config-pronto-pra-PM', status: 'processado' }], updates: [{ ts: '2026-06-11T10:00:00Z', tipo: 'TRD', texto: 'agent-pm-skills-marketplace.md gerado' }] }
    ]},
    { id: 'pesquisar', label: '🔍 pesquisar', cards: []},
    { id: 'aprofundar', label: '🧪 aprofundar', cards: []},
    { id: 'desenvolver', label: '🛠️ desenvolver', cards: []}
  ],
  containers: []
});

// ===== STATE =====
let DATA = null;
let CURRENT_FILTER = 'all';
let OPEN_CARD_ID = null;
let saveTimer = null;

// ===== LOAD =====
async function load() {
  setSync('loading');
  // 1. try localStorage
  const cached = localStorage.getItem(LS_KEY);
  if (cached) {
    try { DATA = JSON.parse(cached); render(); } catch (e) {}
  }
  // 2. fetch latest from jsonbin (private bin precisa da X-Master-Key mesmo no GET)
  try {
    const r = await fetch(`${BASE}/b/${BIN_ID}/latest`, {
      cache: 'no-store',
      headers: { 'X-Master-Key': API_KEY }
    });
    if (r.ok) {
      const j = await r.json();
      const fresh = j.record;
      if (!DATA || JSON.stringify(DATA) !== JSON.stringify(fresh)) {
        DATA = fresh;
        localStorage.setItem(LS_KEY, JSON.stringify(DATA));
        render();
      }
      setSync('ok', 'jsonbin');
    } else {
      setSync('error', 'jsonbin: ' + r.status);
    }
  } catch (e) {
    setSync('error', 'offline');
  }
  // 3. seed if empty
  if (!DATA) {
    DATA = SEED();
    localStorage.setItem(LS_KEY, JSON.stringify(DATA));
    save();
    render();
  }
}

// ===== SAVE (debounced) =====
function save() {
  setSync('dirty', 'sincronizando…');
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch(`${BASE}/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'X-Master-Key': API_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(DATA)
      });
      if (r.ok) setSync('ok', 'jsonbin');
      else setSync('error', 'jsonbin: ' + r.status);
    } catch (e) {
      setSync('error', 'offline');
    }
  }, 500);
}

function setSync(state, text) {
  const el = document.getElementById('sync');
  el.className = 'sync ' + state;
  document.getElementById('syncText').textContent = text || state;
}

// ===== RENDER =====
function render() {
  const board = document.getElementById('board');
  const colsToShow = CURRENT_FILTER === 'desenvolver'
    ? DATA.columns.filter(c => c.id === 'desenvolver')
    : DATA.columns;
  const colsHtml = colsToShow.map(col => `
    <div class="col">
      <div class="col-head">
        <span>${col.label}</span>
        <span class="count">${col.cards.length}</span>
      </div>
      <div class="col-body" data-col="${col.id}">
        ${col.cards.length === 0 ? '<div class="empty">solte uma ideia aqui</div>' : ''}
        ${col.cards.map(renderCard).join('')}
      </div>
    </div>
  `).join('');
  const contHtml = `
    <div class="containers-area">
      <div class="head">
        <span>📦 containers (mistura)</span>
        <button class="add-container-btn" id="addCont" style="width:auto;margin:0;padding:2px 8px;font-size:10px;">+ novo</button>
      </div>
      <div class="body" id="contBody">
        ${DATA.containers.length === 0 ? '<div class="empty" style="color:var(--pink);opacity:.5;">arraste 2+ cards aqui pra fundir ideias</div>' : ''}
        ${DATA.containers.map(renderContainer).join('')}
      </div>
    </div>
  `;
  board.innerHTML = colsHtml + contHtml;
  initSortables();
  bindCardClicks();
  document.getElementById('addCont').onclick = addContainer;
}

function renderCard(c) {
  const tagsHtml = (c.tags || []).map(t => `<span class="badge ${t}">${t}</span>`).join('');
  const autorBadge = c.autor === 'hermes' ? '<span class="badge hermes">hermes</span>' : '';
  const hasDir = c.direcionamentos && c.direcionamentos.length > 0 ? ' has-dir' : '';
  const dirCount = c.direcionamentos ? c.direcionamentos.length : 0;
  return `
    <div class="card${hasDir}" data-id="${c.id}">
      <div class="title"><span class="emoji">${c.emoji}</span>${escapeHtml(c.title)}</div>
      <div class="tagline">${escapeHtml(c.tagline || '')}</div>
      <div class="meta">${tagsHtml}${autorBadge}${dirCount > 0 ? `<span class="badge">${dirCount} 💡</span>` : ''}</div>
    </div>
  `;
}

function renderContainer(cont) {
  return `
    <div class="container" data-cont="${cont.id}">
      <div class="name">
        <input type="text" value="${escapeHtml(cont.name)}" data-action="rename-cont" data-cont="${cont.id}" />
        <button data-action="del-cont" data-cont="${cont.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">×</button>
      </div>
      <div class="cards-mini" data-cont="${cont.id}">
        ${cont.cards.length === 0 ? '<div class="empty">arraste cards aqui</div>' : ''}
        ${cont.cards.map(c => `<div class="mini-card" data-id="${c.id}"><span>${c.emoji}</span>${escapeHtml(c.title)}</div>`).join('')}
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== DRAG/DROP =====
let activeColSortable = null;
function initSortables() {
  // cada coluna
  document.querySelectorAll('.col-body').forEach(body => {
    Sortable.create(body, {
      group: 'cards',
      animation: 150,
      ghostClass: 'ghost',
      dragClass: 'dragging',
      forceFallback: false, // funciona touch nativamente
      onAdd: (evt) => {
        const cardId = evt.item.dataset.id;
        const fromCol = evt.from.dataset.col;
        const fromCont = evt.from.dataset.cont;
        const toCol = evt.to.dataset.col;
        const toCont = evt.to.dataset.cont;
        moveCard(cardId, fromCol, fromCont, toCol, toCont, evt.newIndex);
      }
    });
  });
  // containers
  document.querySelectorAll('.cards-mini').forEach(body => {
    Sortable.create(body, {
      group: 'cards',
      animation: 150,
      ghostClass: 'ghost',
      dragClass: 'dragging',
      onAdd: (evt) => {
        const cardId = evt.item.dataset.id;
        const fromCol = evt.from.dataset.col;
        const fromCont = evt.from.dataset.cont;
        const toCont = evt.to.dataset.cont;
        moveCard(cardId, fromCol, fromCont, null, toCont, evt.newIndex);
      }
    });
  });
  // containers-area body (drop em qualquer container novo)
  const contBody = document.getElementById('contBody');
  if (contBody) {
    Sortable.create(contBody, {
      group: 'cards',
      animation: 150,
      onAdd: (evt) => {
        const cardId = evt.item.dataset.id;
        const fromCol = evt.from.dataset.col;
        const fromCont = evt.from.dataset.cont;
        // criar container novo automaticamente
        const cont = { id: 'cont-' + Date.now(), name: 'novo container', cards: [] };
        cont.cards.push(takeCard(cardId, fromCol, fromCont));
        DATA.containers.push(cont);
        evt.item.remove();
        save();
        render();
      }
    });
  }
}

function takeCard(cardId, fromCol, fromCont) {
  if (fromCol) {
    const col = DATA.columns.find(c => c.id === fromCol);
    const idx = col.cards.findIndex(c => c.id === cardId);
    return col.cards.splice(idx, 1)[0];
  } else {
    const cont = DATA.containers.find(c => c.id === fromCont);
    const idx = cont.cards.findIndex(c => c.id === cardId);
    return cont.cards.splice(idx, 1)[0];
  }
}

function moveCard(cardId, fromCol, fromCont, toCol, toCont, newIndex) {
  const card = takeCard(cardId, fromCol, fromCont);
  if (toCol) {
    const col = DATA.columns.find(c => c.id === toCol);
    col.cards.splice(newIndex, 0, card);
  } else {
    const cont = DATA.containers.find(c => c.id === toCont);
    cont.cards.splice(newIndex, 0, card);
  }
  save();
  render();
}

// ===== CONTAINERS =====
function addContainer() {
  DATA.containers.push({ id: 'cont-' + Date.now(), name: 'novo container', cards: [] });
  save();
  render();
}

// ===== CARD CLICKS =====
function bindCardClicks() {
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.sortable-drag')) return; // evita click durante drag
      openCard(el.dataset.id);
    });
  });
  document.querySelectorAll('[data-action="rename-cont"]').forEach(el => {
    el.addEventListener('change', (e) => {
      const cont = DATA.containers.find(c => c.id === el.dataset.cont);
      cont.name = el.value;
      save();
    });
  });
  document.querySelectorAll('[data-action="del-cont"]').forEach(el => {
    el.addEventListener('click', () => {
      const cont = DATA.containers.find(c => c.id === el.dataset.cont);
      // devolve cards pra coluna "ideia" por default
      cont.cards.forEach(c => {
        DATA.columns.find(col => col.id === 'ideia').cards.push(c);
      });
      DATA.containers = DATA.containers.filter(c => c.id !== el.dataset.cont);
      save();
      render();
    });
  });
}

// ===== MODAL =====
function findCard(id) {
  for (const col of DATA.columns) {
    const c = col.cards.find(x => x.id === id);
    if (c) return { card: c, col };
  }
  for (const cont of DATA.containers) {
    const c = cont.cards.find(x => x.id === id);
    if (c) return { card: c, cont };
  }
  return null;
}

function openCard(id) {
  const found = findCard(id);
  if (!found) return;
  OPEN_CARD_ID = id;
  const c = found.card;
  document.getElementById('modalTitle').innerHTML = `${c.emoji} ${escapeHtml(c.title)} <span style="color:var(--muted);font-size:11px;font-weight:400;">${found.col ? found.col.label : '📦 ' + found.cont.name}</span>`;
  document.getElementById('fTitle').value = c.title;
  document.getElementById('fTagline').value = c.tagline || '';
  document.getElementById('fNewDir').value = '';
  const dirList = document.getElementById('fDirList');
  dirList.innerHTML = (c.direcionamentos || []).map(d => `
    <li><span class="ts">${formatTs(d.ts)}</span><span>${escapeHtml(d.texto)}</span></li>
  `).join('') || '<li style="color:var(--muted);border:none;font-style:italic;">nenhum ainda</li>';
  const upList = document.getElementById('fUpdates');
  upList.innerHTML = (c.updates || []).slice().reverse().map(u => `
    <li><span class="date">${formatTs(u.ts)}</span><span style="color:var(--accent);">${u.tipo}</span><span>${escapeHtml(u.texto)}</span></li>
  `).join('') || '<li style="color:var(--muted);border:none;">nenhum ainda</li>';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  OPEN_CARD_ID = null;
}

function saveCard() {
  const found = findCard(OPEN_CARD_ID);
  if (!found) return;
  const c = found.card;
  c.title = document.getElementById('fTitle').value.trim() || c.title;
  c.tagline = document.getElementById('fTagline').value.trim();
  const newDir = document.getElementById('fNewDir').value.trim();
  if (newDir) {
    if (!c.direcionamentos) c.direcionamentos = [];
    c.direcionamentos.push({ ts: new Date().toISOString(), texto: newDir, status: 'pendente' });
    c.updates = c.updates || [];
    c.updates.push({ ts: new Date().toISOString(), tipo: 'dir', texto: newDir });
  }
  save();
  closeModal();
  render();
}

function deleteCard() {
  if (!confirm('arquivar este card?')) return;
  for (const col of DATA.columns) {
    const idx = col.cards.findIndex(c => c.id === OPEN_CARD_ID);
    if (idx >= 0) { col.cards.splice(idx, 1); break; }
  }
  for (const cont of DATA.containers) {
    const idx = cont.cards.findIndex(c => c.id === OPEN_CARD_ID);
    if (idx >= 0) { cont.cards.splice(idx, 1); break; }
  }
  save();
  closeModal();
  render();
}

function formatTs(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ===== NEW CARD =====
function openNewCard() {
  document.getElementById('newBg').classList.add('open');
  document.getElementById('nTitle').focus();
}
function closeNewCard() {
  document.getElementById('newBg').classList.remove('open');
}
function createCard() {
  const title = document.getElementById('nTitle').value.trim();
  if (!title) return alert('título obrigatório');
  const emoji = document.getElementById('nEmoji').value.trim() || '💡';
  const tagline = document.getElementById('nTag').value.trim();
  const colId = document.getElementById('nCol').value;
  const card = {
    id: 'c' + Date.now(),
    emoji, title, tagline,
    autor: 'renato',
    tags: [],
    direcionamentos: [],
    updates: [{ ts: new Date().toISOString(), tipo: 'novo', texto: 'criado pelo Renato' }]
  };
  DATA.columns.find(c => c.id === colId).cards.push(card);
  save();
  closeNewCard();
  render();
  document.getElementById('nTitle').value = '';
  document.getElementById('nTag').value = '';
}

// ===== FILTERS =====
document.querySelectorAll('.filtros button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    CURRENT_FILTER = btn.dataset.filter;
    render();
  });
});

// ===== BIND BUTTONS =====
document.getElementById('fab').onclick = openNewCard;
document.getElementById('bCancel').onclick = closeModal;
document.getElementById('bSave').onclick = saveCard;
document.getElementById('bDel').onclick = deleteCard;
document.getElementById('nCancel').onclick = closeNewCard;
document.getElementById('nCreate').onclick = createCard;
document.querySelectorAll('.modal-bg').forEach(el => {
  el.addEventListener('click', (e) => { if (e.target === el) el.classList.remove('open'); });
});

// ===== START =====
load();
</script>
