<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades Diárias — Lyriane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #2a2a4a; margin-bottom: 30px; }
        h1 { color: #7c3aed; font-size: 2em; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 0.9em; }
        .filters { background: #1a1a2e; padding: 20px; border-radius: 12px; margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 10px 15px; border: 1px solid #2a2a4a; border-radius: 8px; background: #0f0f1a; color: #fff; font-size: 0.9em; }
        .filters input { flex: 1; min-width: 200px; }
        .filters select { min-width: 150px; }
        .filters button { padding: 10px 15px; background: #2a2a4a; color: #fff; border: 1px solid #7c3aed; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85em; }
        .filters button:hover { background: #7c3aed; }
        .filters button.active { background: #7c3aed; border-color: #a78bfa; }
        .filters button.novo-active { background: #10b981; border-color: #34d399; }
        .filters .sort-group { display: flex; gap: 5px; align-items: center; margin-left: 10px; }
        .filters .sort-group span { color: #888; font-size: 0.8em; margin-right: 5px; }
        .meta-info { color: #666; font-size: 0.85em; margin-bottom: 20px; }
        .section { margin-bottom: 40px; }
        .section-title { display: flex; align-items: center; gap: 10px; font-size: 1.4em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2a2a4a; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a4a; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #7c3aed; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        .card-title { font-size: 1.1em; font-weight: 700; color: #fff; flex: 1; }
        .card-badge { font-size: 0.75em; padding: 4px 10px; border-radius: 20px; background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; }
        .card-header-right { display: flex; align-items: center; gap: 8px; }
        .tag.novo { background: #1e40af; color: #fb923c; border: 1px solid #fb923c; font-weight: 700; }
        .card-meta { font-size: 0.8em; color: #666; margin-bottom: 10px; display: flex; gap: 15px; flex-wrap: wrap; }
        .card-meta span { display: flex; align-items: center; gap: 4px; }
        .card-desc { color: #aaa; line-height: 1.6; font-size: 0.95em; }
        .card-tags { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 0.75em; padding: 3px 10px; border-radius: 6px; background: #2a2a4a; color: #888; }
        .tag.origem { background: #3b82f620; color: #60a5fa; border: 1px solid #3b82f640; }
        .tag.categoria { background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; }
        .vol { font-weight: 700; color: #10b981; }
        .growth { color: #f59e0b; font-weight: 600; }
        .link-btn { font-size: 0.75em; padding: 3px 10px; border-radius: 6px; background: #2a2a4a; color: #60a5fa; text-decoration: none; border: 1px solid #3b82f640; }
        .link-btn:hover { background: #3b82f630; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        @media (max-width: 600px) { .filters { flex-direction: column; } .card-header { flex-direction: column; gap: 10px; } .sort-group { margin-left: 0; } .card-desc { -webkit-line-clamp: 6; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Oportunidades de Negócio</h1>
            <p class="subtitle">Tendências, ferramentas e ideias para renda extra — atualizado automaticamente</p>
        </header>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterCards()">
            <select id="categoriaFilter" onchange="filterCards()">
                <option value="">Todas Categorias</option>
                <option value="app">App / Ferramenta</option>
                <option value="tendencia">Tendência</option>
                <option value="negocio">Micro-SaaS / Negócio</option>
            </select>
            <select id="origemFilter" onchange="filterCards()">
                <option value="">Todas Origens</option>
                <option value="global">Global</option>
                <option value="brasil">Brasil</option>
            </select>
            <button class="active" id="allBtn" onclick="showAll()">Todos</button>
            <button id="novoBtn" onclick="showNew()">Novos</button>
            <div class="sort-group">
                <span>Ordenar:</span>
                <button onclick="sortCards('stars')">★ Stars</button>
                <button onclick="sortCards('crescimento')">📈 Crescimento</button>
                <button onclick="sortCards('volume')">📊 Volume</button>
                <button onclick="sortCards('data')">🕐 Data</button>
            </div>
        </div>

        <p class="meta-info" id="metaInfo">Carregando...</p>
        <div id="cardsGrid"></div>
    </div>

    <script>
    let allCards = [];
    let currentFilter = 'all';
    let currentSort = 'stars';

    const DATA_URL = 'dados.json';

    async function loadData() {
        try {
            const res = await fetch(DATA_URL + '?t=' + Date.now());
            const data = await res.json();
            allCards = data;
            renderCards(allCards);
            document.getElementById('metaInfo').textContent = data.length + ' oportunidades carregadas em ''' + new Date().toLocaleString('pt-BR') + '''';
        } catch (e) {
            document.getElementById('cardsGrid').innerHTML = '<p class="empty-state">Erro ao carregar dados. Tente novamente.</p>';
        }
    }

    function renderCards(cards) {
        const grid = document.getElementById('cardsGrid');
        if (cards.length === 0) {
            grid.innerHTML = '<p class="empty-state">Nenhuma oportunidade encontrada.</p>';
            return;
        }
        grid.innerHTML = cards.map((item, i) => {
            const isNew = item.data_publicacao && item.data_publicacao.includes('31/05/2026');
            const stars = item.stars ? '<span>★ ' + item.stars + '</span>' : '';
            const forks = item.forks ? '<span>⑂ ' + item.forks + '</span>' : '';
            const vol = item.volume ? '<span class="vol">Vol: ' + item.volume + '</span>' : '';
            const cresc = item.crescimento ? '<span class="growth">' + item.crescimento + '</span>' : '';
            const data = item.data_publicacao ? '<span>🕐 ' + item.data_publicacao + '</span>' : '';
            const tags = (item.tags || []).map(t => '<span class="tag">' + t + '</span>').join('');
            const novoTag = isNew ? '<span class="tag novo">NOVO</span>' : '';
            return '<div class="card" data-categoria="' + (item.categoria||'') + '" data-origem="' + (item.origem||'') + '" data-new="' + isNew + '">' +
                '<div class="card-header">' +
                    '<div class="card-title">' + item.titulo + '</div>' +
                    '<div class="card-header-right">' + novoTag + '<span class="card-badge">' + item.badge + '</span></div>' +
                '</div>' +
                '<div class="card-meta">' + stars + forks + vol + cresc + data + '</div>' +
                '<p class="card-desc">' + item.descricao + '</p>' +
                '<div class="card-tags">' +
                    '<span class="tag origem">' + (item.origem||'') + '</span>' +
                    '<span class="tag categoria">' + (item.categoria||'') + '</span>' +
                    tags +
                '</div>' +
            '</div>';
        }).join('');
    }

    function filterCards() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const cat = document.getElementById('categoriaFilter').value;
        const orig = document.getElementById('origemFilter').value;
        const filtered = allCards.filter(item => {
            const matchSearch = !search || item.titulo.toLowerCase().includes(search) || item.descricao.toLowerCase().includes(search) || (item.tags||[]).some(t=>t.toLowerCase().includes(search));
            const matchCat = !cat || item.categoria === cat;
            const matchOrig = !orig || item.origem === orig;
            return matchSearch && matchCat && matchOrig;
        });
        renderCards(filtered);
    }

    function showAll() {
        currentFilter = 'all';
        document.getElementById('allBtn').classList.add('active');
        document.getElementById('novoBtn').classList.remove('active');
        document.getElementById('categoriaFilter').value = '';
        document.getElementById('origemFilter').value = '';
        document.getElementById('searchInput').value = '';
        renderCards(allCards);
    }

    function showNew() {
        currentFilter = 'new';
        document.getElementById('allBtn').classList.remove('active');
        document.getElementById('novoBtn').classList.add('active');
        document.getElementById('novoBtn').classList.add('novo-active');
        const novos = allCards.filter(item => item.data_publicacao && item.data_publicacao.includes('31/05/2026'));
        renderCards(novos);
    }

    function sortCards(by) {
        currentSort = by;
        let sorted = [...allCards];
        if (by === 'stars') {
            sorted.sort((a, b) => {
                const sa = parseFloat((a.stars||'0').replace(/[^0-9.]/g,'')) || 0;
                const sb = parseFloat((b.stars||'0').replace(/[^0-9.]/g,'')) || 0;
                return sb - sa;
            });
        } else if (by === 'crescimento') {
            sorted.sort((a, b) => {
                const ca = parseFloat((a.crescimento||'0').replace(/[^0-9]/g,'')) || 0;
                const cb = parseFloat((b.crescimento||'0').replace(/[^0-9]/g,'')) || 0;
                return cb - ca;
            });
        } else if (by === 'volume') {
            sorted.sort((a, b) => {
                const va = parseFloat((a.volume||'0').replace(/[^0-9]/g,'')) || 0;
                const vb = parseFloat((b.volume||'0').replace(/[^0-9]/g,'')) || 0;
                return vb - va;
            });
        } else if (by === 'data') {
            sorted.sort((a, b) => {
                const da = a.data_publicacao || '';
                const db = b.data_publicacao || '';
                return db.localeCompare(da);
            });
        }
        renderCards(sorted);
    }

    loadData();
    </script>
</body>
</html>
