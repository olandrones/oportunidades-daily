<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades Diárias — Lyriane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }

        /* ── HEADER ── */
        header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid #2a2a4a; margin-bottom: 20px; }
        h1 { color: #7c3aed; font-size: 1.6em; margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 0.8em; }

        /* ── VIEW SWITCH (cards / tabela) ── */
        .view-switch { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .view-link { font-size: 0.75em; color: #888; text-decoration: none; padding: 4px 12px; border-radius: 7px; border: 1px solid #2a2a4a; transition: all 0.15s; }
        .view-link:hover { color: #fff; border-color: #7c3aed; }
        .view-link.active { color: #a78bfa; border-color: #7c3aed; background: #7c3aed20; }
        .hoje-count { font-size: 0.72em; color: #fb923c; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: #1e40af30; border: 1px solid #1e40af60; margin-left: 6px; }

        /* ── CARD: badge HOJE ── */
        .card.is-hoje { border-color: #1e40af; background: #13133a; }
        .card-badge.is-hoje { background: #1e40af; color: #fb923c; font-weight: 700; }

        /* ── RESUMO SEMÂNTICO ── */
        .resumo-semantico { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; padding: 12px; background: #13132a; border-radius: 10px; border: 1px solid #2a2a4a; }
        .resumo-stat { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: #1a1a2e; border: 1px solid #2a2a4a; cursor: pointer; font-size: 0.78em; transition: all 0.2s; color: #888; }
        .resumo-stat:hover { border-color: #7c3aed; color: #e0e0e0; }
        .resumo-stat.active { background: #7c3aed20; border-color: #7c3aed; color: #a78bfa; }
        .resumo-stat .num { font-weight: 700; color: #fff; }
        .resumo-stat.all-stat { border-color: #444; }

        /* ── TOGGLE FILTERS ── */
        .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .filter-group { display: flex; gap: 4px; background: #1a1a2e; padding: 4px; border-radius: 10px; }
        .filter-btn { padding: 7px 14px; border: none; border-radius: 7px; background: transparent; color: #888; font-size: 0.8em; cursor: pointer; transition: all 0.2s; font-weight: 500; }
        .filter-btn:hover { color: #e0e0e0; background: #2a2a4a; }
        .filter-btn.active { background: #7c3aed; color: #fff; }

        /* ── GRID DE CARDS ── */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
        @media (max-width: 400px) { .cards-grid { grid-template-columns: 1fr; } }

        /* ── CARD ── */
        .card { background: #1a1a2e; border-radius: 10px; padding: 14px; border: 1px solid #2a2a4a; transition: border-color 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .card:hover { border-color: #7c3aed; }
        .card.hidden { display: none; }

        /* Card: header row */
        .card-header { display: flex; align-items: flex-start; gap: 8px; }
        .card-title { font-size: 0.9em; font-weight: 700; color: #fff; flex: 1; line-height: 1.3; }
        .card-badge { font-size: 0.7em; padding: 3px 8px; border-radius: 12px; background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; white-space: nowrap; flex-shrink: 0; }

        /* Card: inline meta + tags row */
        .card-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .card-meta-item { font-size: 0.72em; color: #666; display: flex; align-items: center; gap: 3px; }
        .card-meta-item .vol { color: #10b981; font-weight: 700; }
        .card-meta-item .growth { color: #f59e0b; font-weight: 600; }
        .card-meta-item .sep { color: #333; }
        .card-tag { font-size: 0.68em; padding: 2px 7px; border-radius: 5px; background: #2a2a4a; color: #777; }
        .card-tag.origem-tag { background: #3b82f620; color: #60a5fa; }

        /* Card: description */
        .card-desc { font-size: 0.78em; color: #999; line-height: 1.5; }

        /* Card: link (inline, looks like a tag) */
        .card-link { display: inline-flex; align-items: center; gap: 3px; font-size: 0.68em; padding: 2px 7px; border-radius: 5px; background: #2a2a4a; color: #a78bfa; text-decoration: none; }
        .card-link:hover { background: #7c3aed; color: #fff; }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 60px; color: #555; grid-column: 1 / -1; }

        /* ── FOOTER META ── */
        .page-meta { text-align: center; color: #444; font-size: 0.75em; padding: 20px 0; margin-top: 20px; border-top: 1px solid #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Oportunidades Diárias</h1>
            <p class="subtitle">Relatório automático de tendências e oportunidades — atualizado 3x ao dia</p>
            <div class="view-switch">
                <a class="view-link active" href="./">🃏 Cards</a>
                <a class="view-link" href="./tabela.html">📋 Tabela</a>
                <span class="hoje-count" id="hojeCount"></span>
            </div>
        </header>

        <!-- Resumo semântico clicável -->
        <div class="resumo-semantico" id="resumoSemantico"></div>

        <!-- Toggle filters -->
        <div class="filters">
            <div class="filter-group" id="filterPeriodo">
                <button class="filter-btn" data-periodo="tudo">Tudo</button>
                <button class="filter-btn" data-periodo="hoje">🆕 Hoje</button>
                <button class="filter-btn" data-periodo="7d">7 dias</button>
                <button class="filter-btn" data-periodo="30d">30 dias</button>
            </div>
            <div class="filter-group" id="filterCategoria"></div>
            <div class="filter-group" id="filterOrigem"></div>
            <button class="filter-btn" id="btnOrdenar">🔥 Ordenar por calor</button>
        </div>

        <!-- Grid de cards -->
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <div class="page-meta" id="pageMeta"></div>

    <script>
        let dados = [];
        let filtroCat = '';
        let filtroOrigem = '';
        let filtroTag = '';
        let filtroPeriodo = 'tudo'; // tudo | hoje | 7d | 30d
        let ordenacao = 'default';

        function parseNumero(str) {
            if (!str) return 0;
            str = str.replace(/,/g, '');
            if (str.includes('K')) return parseFloat(str) * 1000;
            if (str.includes('M')) return parseFloat(str) * 1000000;
            return parseFloat(str) || 0;
        }

        function parseDataPub(str) {
            if (!str) return new Date(0);
            const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
            if (!m) return new Date(0);
            return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
        }
        function isHoje(date) {
            const hoje = new Date();
            return date.getFullYear() === hoje.getFullYear() && date.getMonth() === hoje.getMonth() && date.getDate() === hoje.getDate();
        }
        function isUltimos7Dias(date) {
            const diff = (Date.now() - date.getTime()) / (1000*60*60*24);
            return diff >= 0 && diff <= 7;
        }
        function isUltimos30Dias(date) {
            const diff = (Date.now() - date.getTime()) / (1000*60*60*24);
            return diff >= 0 && diff <= 30;
        }

        function calcularCalor(item) {
            const cresc = parseNumero(item.crescimento);
            const stars = parseNumero(item.stars);
            if (stars > 0) return Math.log10(stars + 1) * 10;
            if (cresc > 0) return Math.log10(cresc + 1) * 5;
            return 0;
        }

        function ordenarCards() {
            if (ordenacao === 'default') return;
            const grid = document.getElementById('cardsGrid');
            const cards = Array.from(grid.querySelectorAll('.card:not(.hidden)'));
            cards.sort((a, b) => {
                const tituloA = a.querySelector('.card-title').textContent.trim();
                const tituloB = b.querySelector('.card-title').textContent.trim();
                const ia = dados.find(d => d.titulo.trim() === tituloA);
                const ib = dados.find(d => d.titulo.trim() === tituloB);
                if (!ia || !ib) return 0;
                return calcularCalor(ib) - calcularCalor(ia);
            });
            cards.forEach(c => grid.appendChild(c));
        }

        function gerarUrl(item) {
            // Extrai nome limpo do título
            const nome = item.titulo
                .replace(/[^\w\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .split(' ')
                .slice(0, 4)
                .join(' ');

            if (item.fonte === 'GitHub Trending') {
                return `https://github.com/search?q=${encodeURIComponent(nome)}&s=stars&type=repositories`;
            }
            return `https://www.google.com/search?q=${encodeURIComponent(nome + ' ' + item.fonte)}`;
        }

        function renderResumoSemantico() {
            const total = dados.length;
            const cats = { tendencia: 0, app: 0, negocio: 0 };
            const origens = { global: 0, brasil: 0 };
            const todasTags = {};

            dados.forEach(d => {
                cats[d.categoria]++;
                origens[d.origem]++;
                (d.tags || []).forEach(t => { todasTags[t] = (todasTags[t] || 0) + 1; });
            });

            // Top 6 tags
            const topTags = Object.entries(todasTags)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            let html = `<div class="resumo-stat all-stat ${!filtroCat && !filtroOrigem && !filtroTag ? 'active' : ''}" data-filter="all">
                <span class="num">${total}</span> total
            </div>
            <div class="resumo-stat ${filtroCat === 'tendencia' ? 'active' : ''}" data-filter="cat:tendencia">
                <span class="num">${cats.tendencia}</span> 🔥 tendências
            </div>
            <div class="resumo-stat ${filtroCat === 'app' ? 'active' : ''}" data-filter="cat:app">
                <span class="num">${cats.app}</span> 🚀 apps
            </div>
            <div class="resumo-stat ${filtroCat === 'negocio' ? 'active' : ''}" data-filter="cat:negocio">
                <span class="num">${cats.negocio}</span> 💼 negócios
            </div>
            <div class="resumo-stat ${filtroOrigem === 'global' ? 'active' : ''}" data-filter="origem:global">
                <span class="num">${origens.global}</span> 🌐 global
            </div>
            <div class="resumo-stat ${filtroOrigem === 'brasil' ? 'active' : ''}" data-filter="origem:brasil">
                <span class="num">${origens.brasil}</span> 🇧🇷 brasil
            </div>`;

            if (topTags.length) {
                html += `<div style="width:1px;background:#2a2a4a;margin:0 4px;"></div>`;
                topTags.forEach(([tag, count]) => {
                    html += `<div class="resumo-stat ${filtroTag === tag ? 'active' : ''}" data-filter="tag:${tag}">
                        <span class="num">${count}</span> ${tag}
                    </div>`;
                });
            }

            document.getElementById('resumoSemantico').innerHTML = html;

            // Bind click
            document.querySelectorAll('.resumo-stat[data-filter]').forEach(el => {
                el.addEventListener('click', () => {
                    const f = el.dataset.filter;
                    if (f === 'all') { filtroCat = ''; filtroOrigem = ''; filtroTag = ''; }
                    else if (f.startsWith('cat:')) { filtroCat = filtroCat === f.slice(4) ? '' : f.slice(4); }
                    else if (f.startsWith('origem:')) { filtroOrigem = filtroOrigem === f.slice(7) ? '' : f.slice(7); }
                    else if (f.startsWith('tag:')) { filtroTag = filtroTag === f.slice(4) ? '' : f.slice(4); }
                    atualizarFiltros();
                });
            });
        }

        function renderFiltros() {
            const cats = [
                { val: '', label: 'Todas' },
                { val: 'tendencia', label: '🔥 Tendência' },
                { val: 'app', label: '🚀 App' },
                { val: 'negocio', label: '💼 Negócio' }
            ];
            const origens = [
                { val: '', label: 'Todas' },
                { val: 'global', label: '🌐 Global' },
                { val: 'brasil', label: '🇧🇷 Brasil' }
            ];

            document.getElementById('filterCategoria').innerHTML = cats.map(c => `
                <button class="filter-btn ${filtroCat === c.val ? 'active' : ''}" data-cat="${c.val}">${c.label}</button>
            `).join('');

            document.getElementById('filterOrigem').innerHTML = origens.map(o => `
                <button class="filter-btn ${filtroOrigem === o.val ? 'active' : ''}" data-origem="${o.val}">${o.label}</button>
            `).join('');

            document.querySelectorAll('[data-cat]').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroCat = filtroCat === btn.dataset.cat ? '' : btn.dataset.cat;
                    atualizarFiltros();
                });
            });
            document.querySelectorAll('[data-origem]').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroOrigem = filtroOrigem === btn.dataset.origem ? '' : btn.dataset.origem;
                    atualizarFiltros();
                    if (ordenacao === 'calor') ordenarCards();
                });
            });
            document.querySelectorAll('[data-periodo]').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroPeriodo = btn.dataset.periodo;
                    atualizarFiltros();
                    if (ordenacao === 'calor') ordenarCards();
                });
            });

            // Ordenar por calor
            document.getElementById('btnOrdenar').addEventListener('click', () => {
                ordenacao = ordenacao === 'default' ? 'calor' : 'default';
                const btn = document.getElementById('btnOrdenar');
                btn.classList.toggle('active', ordenacao === 'calor');
                btn.textContent = ordenacao === 'calor' ? '↺ Limpar ordenação' : '🔥 Ordenar por calor';
                if (ordenacao === 'calor') {
                    ordenarCards();
                } else {
                    location.reload();
                }
            });
        }

        function renderCard(item) {
            const dp = parseDataPub(item.data_publicacao);
            const hoj = isHoje(dp);
            let metaHtml = '';
            if (item.stars) {
                metaHtml += `<span class="card-meta-item">⭐ <span class="vol">${item.stars}</span></span>`;
                if (item.forks) metaHtml += `<span class="sep">·</span><span class="card-meta-item">🍴 <span class="vol">${item.forks}</span></span>`;
            } else if (item.volume) {
                metaHtml += `<span class="card-meta-item">🔊 <span class="vol">${item.volume}</span></span>`;
                if (item.crescimento) metaHtml += `<span class="sep">·</span><span class="card-meta-item">📈 <span class="growth">${item.crescimento}</span></span>`;
            }
            metaHtml += `<span class="sep">·</span><span class="card-meta-item">${item.origem === 'brasil' ? '🇧🇷' : '🌐'}</span>`;
            metaHtml += `<span class="sep">·</span><span class="card-meta-item">📅 ${item.data_publicacao ? item.data_publicacao.split(' ').slice(0,2).join(' ') : ''}</span>`;

            const tagsHtml = (item.tags || []).slice(0, 3).map(t => `<span class="card-tag">${t}</span>`).join('');
            const fonteHtml = item.fonte ? `<span class="card-tag origem-tag">${item.fonte}</span>` : '';
            const url = gerarUrl(item);
            const badgeClass = hoj ? 'card-badge is-hoje' : 'card-badge';
            const badgeText = hoj ? '🆕 HOJE' : item.badge;
            const cardClass = hoj ? 'card is-hoje' : 'card';

            return `<div class="${cardClass}" data-categoria="${item.categoria}" data-origem="${item.origem}" data-tags="${(item.tags || []).join(',')}" data-data="${item.data_publicacao || ''}">
                <div class="card-header">
                    <div class="card-title">${item.titulo}</div>
                    <div class="${badgeClass}">${badgeText}</div>
                </div>
                <div class="card-meta-row">
                    ${metaHtml}
                    ${tagsHtml}
                    ${fonteHtml}
                    <a class="card-link" href="${url}" target="_blank" rel="noopener">🔗 link</a>
                </div>
                <div class="card-desc">${item.descricao}</div>
            </div>`;
        }

        function atualizarFiltros() {
            // Atualiza estado visual dos botões
            document.querySelectorAll('[data-cat]').forEach(btn => {
                btn.classList.toggle('active', filtroCat === btn.dataset.cat);
            });
            document.querySelectorAll('[data-origem]').forEach(btn => {
                btn.classList.toggle('active', filtroOrigem === btn.dataset.origem);
            });
            document.querySelectorAll('[data-periodo]').forEach(btn => {
                btn.classList.toggle('active', filtroPeriodo === btn.dataset.periodo);
            });
            document.querySelectorAll('.resumo-stat').forEach(el => {
                const f = el.dataset.filter;
                let active = false;
                if (f === 'all') active = !filtroCat && !filtroOrigem && !filtroTag && filtroPeriodo === 'tudo';
                else if (f.startsWith('cat:')) active = filtroCat === f.slice(4);
                else if (f.startsWith('origem:')) active = filtroOrigem === f.slice(7);
                else if (f.startsWith('tag:')) active = filtroTag === f.slice(4);
                el.classList.toggle('active', active);
            });

            // Filtra cards
            const cards = document.querySelectorAll('.card');
            let visiveis = 0;
            cards.forEach(c => {
                const cat = c.dataset.categoria;
                const orig = c.dataset.origem;
                const tags = c.dataset.tags.split(',');
                const dataStr = c.dataset.data || '';
                const matchCat = !filtroCat || cat === filtroCat;
                const matchOrig = !filtroOrigem || orig === filtroOrigem;
                const matchTag = !filtroTag || tags.includes(filtroTag);
                let matchPeriodo = true;
                if (filtroPeriodo !== 'tudo') {
                    const dp = parseDataPub(dataStr);
                    if (filtroPeriodo === 'hoje') matchPeriodo = isHoje(dp);
                    else if (filtroPeriodo === '7d') matchPeriodo = isUltimos7Dias(dp);
                    else if (filtroPeriodo === '30d') matchPeriodo = isUltimos30Dias(dp);
                }
                const mostrar = matchCat && matchOrig && matchTag && matchPeriodo;
                c.classList.toggle('hidden', !mostrar);
                if (mostrar) visiveis++;
            });

            const total = dados.length;
            const novosHoje = dados.filter(d => isHoje(parseDataPub(d.data_publicacao))).length;
            document.getElementById('hojeCount').textContent = novosHoje > 0 ? `🆕 ${novosHoje} HOJE` : '';
            document.getElementById('pageMeta').textContent =
                `${visiveis} de ${total} entradas | Atualizado: ${new Date().toLocaleString('pt-BR')}`;
        }

        function carregarDados() {
            fetch('dados.json')
                .then(r => r.json())
                .then(data => {
                    dados = data;
                    renderResumoSemantico();
                    renderFiltros();
                    const grid = document.getElementById('cardsGrid');
                    grid.innerHTML = dados.map(renderCard).join('');

                    atualizarFiltros();
                    if (ordenacao === 'calor') ordenarCards();
                })
                .catch(err => {
                    document.getElementById('cardsGrid').innerHTML =
                        `<div class="empty-state">Erro ao carregar dados: ${err.message}</div>`;
                });
        }

        carregarDados();
    </script>
</body>
</html>
