<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades Diárias — Lyriane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }

        header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid #2a2a4a; margin-bottom: 20px; }
        h1 { color: #7c3aed; font-size: 1.6em; margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 0.8em; }

        .resumo-semantico { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; padding: 12px; background: #13132a; border-radius: 10px; border: 1px solid #2a2a4a; }
        .resumo-stat { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: #1a1a2e; border: 1px solid #2a2a4a; cursor: pointer; font-size: 0.78em; transition: all 0.2s; color: #888; }
        .resumo-stat:hover { border-color: #7c3aed; color: #e0e0e0; }
        .resumo-stat.active { background: #7c3aed20; border-color: #7c3aed; color: #a78bfa; }
        .resumo-stat .num { font-weight: 700; color: #fff; }
        .resumo-stat.all-stat { border-color: #444; }

        .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .filter-group { display: flex; gap: 4px; background: #1a1a2e; padding: 4px; border-radius: 10px; }
        .filter-btn { padding: 7px 14px; border: none; border-radius: 7px; background: transparent; color: #888; font-size: 0.8em; cursor: pointer; transition: all 0.2s; font-weight: 500; }
        .filter-btn:hover { color: #e0e0e0; background: #2a2a4a; }
        .filter-btn.active { background: #7c3aed; color: #fff; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: stretch; }
        @media (max-width: 400px) { .cards-grid { grid-template-columns: 1fr; } }

        .card { background: #1a1a2e; border-radius: 10px; padding: 14px; border: 1px solid #2a2a4a; transition: border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; gap: 6px; /* height auto - grid stretch handles row alignment */ }
        .card:hover { border-color: #7c3aed; }
        .card.hidden { display: none; }

        .card-header { display: flex; align-items: flex-start; gap: 8px; }
        .card-title { font-size: 0.9em; font-weight: 700; color: #fff; flex: 1; line-height: 1.3; }
        .card-badge { font-size: 0.7em; padding: 3px 8px; border-radius: 12px; background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; white-space: nowrap; flex-shrink: 0; }

        .card-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .card-meta-item { font-size: 0.72em; color: #666; display: flex; align-items: center; gap: 3px; }
        .card-meta-item .vol { color: #10b981; font-weight: 700; }
        .card-meta-item .growth { color: #f59e0b; font-weight: 600; }
        .card-meta-item .sep { color: #333; }
        .card-tag { font-size: 0.68em; padding: 2px 7px; border-radius: 5px; background: #2a2a4a; color: #777; }
        .card-tag.origem-tag { background: #3b82f620; color: #60a5fa; }

        .card-desc { font-size: 0.78em; color: #999; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        

        .card-link { display: flex; align-items: center; gap: 5px; font-size: 0.72em; color: #7c3aed; text-decoration: none; padding-top: 6px; border-top: 1px solid #2a2a4a; margin-top: auto; solid #2a2a4a; margin-top: 4px; }
        .card-link:hover { color: #a78bfa; }
        .card.expanded .card-link { display: flex; }

        .empty-state { text-align: center; padding: 60px; color: #555; grid-column: 1 / -1; }
        .page-meta { text-align: center; color: #444; font-size: 0.75em; padding: 20px 0; margin-top: 20px; border-top: 1px solid #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Oportunidades Diárias</h1>
            <p class="subtitle">Relatório automático de tendências e oportunidades — atualizado 3x ao dia</p>
        </header>

        <div class="resumo-semantico" id="resumoSemantico"></div>

        <div class="filters">
            <div class="filter-group" id="filterCategoria"></div>
            <div class="filter-group" id="filterOrigem"></div>
            <div class="filter-group">
                <button class="filter-btn" id="btnOrdenar">🔥 Ordenar por calor</button>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <div class="page-meta" id="pageMeta"></div>

    <script>
        let dados = [];
        let filtroCat = '';
        let filtroOrigem = '';
        let filtroTag = '';
        let ordemTipo = ''; // 'crescimento' | 'stars' | 
        let ordenacao = 'default';

        function parseNumero(str) {
            if (!str) return 0;
            str = str.replace(/,/g, '');
            if (str.includes('K')) return parseFloat(str) * 1000;
            if (str.includes('M')) return parseFloat(str) * 1000000;
            return parseFloat(str) || 0;
        }

        function calcularCalor(item) {
            const cresc = parseNumero(item.crescimento.replace(/[^0-9.,KMB]/g, ''));
            const stars = parseNumero(item.stars);
            const vol = parseNumero(item.volume);
            if (stars > 0) return Math.log10(stars + 1) * 10;
            if (cresc > 0) return Math.log10(cresc + 1) * 5;
            return Math.log10(vol + 1) * 2;
        }

        function ordenarCards() {
            if (ordenacao === 'default') return;
            const grid = document.getElementById('cardsGrid');
            const cards = Array.from(grid.querySelectorAll('.card:not(.hidden)'));
            cards.sort((a, b) => {
                const ia = dados.find(d => d.titulo === a.querySelector('.card-title').textContent.trim());
                const ib = dados.find(d => d.titulo === b.querySelector('.card-title').textContent.trim());
                if (!ia || !ib) return 0;
                return calcularCalor(ib) - calcularCalor(ia);
            });
            cards.forEach(c => grid.appendChild(c));
        }

        function gerarUrl(item) {
            const nome = item.titulo.replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 4).join(' ');
            if (item.fonte === 'GitHub Trending') return `https://github.com/search?q=${encodeURIComponent(nome)}&s=stars&type=repositories`;
            return `https://www.google.com/search?q=${encodeURIComponent(nome + ' ' + item.fonte)}`;
        }

        function renderResumoSemantico() {
            const cats = { tendencia: 0, app: 0, negocio: 0 };
            const origens = { global: 0, brasil: 0 };
            const tagsMap = {};
            dados.forEach(d => {
                cats[d.categoria]++;
                origens[d.origem]++;
                (d.tags || []).forEach(t => { tagsMap[t] = (tagsMap[t] || 0) + 1; });
            });
            const topTags = Object.entries(tagsMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
            let html = `<div class="resumo-stat all-stat ${!filtroCat && !filtroOrigem && !filtroTag ? 'active' : ''}" data-filter="all"><span class="num">${dados.length}</span> total</div>
            <div class="resumo-stat ${filtroCat === 'tendencia' ? 'active' : ''}" data-filter="cat:tendencia"><span class="num">${cats.tendencia}</span> 🔥 tendências</div>
            <div class="resumo-stat ${filtroCat === 'app' ? 'active' : ''}" data-filter="cat:app"><span class="num">${cats.app}</span> 🚀 apps</div>
            <div class="resumo-stat ${filtroCat === 'negocio' ? 'active' : ''}" data-filter="cat:negocio"><span class="num">${cats.negocio}</span> 💼 negócios</div>
            <div class="resumo-stat ${filtroOrigem === 'global' ? 'active' : ''}" data-filter="origem:global"><span class="num">${origens.global}</span> 🌐 global</div>
            <div class="resumo-stat ${filtroOrigem === 'brasil' ? 'active' : ''}" data-filter="origem:brasil"><span class="num">${origens.brasil}</span> 🇧🇷 brasil</div>`;
            if (topTags.length) {
                html += `<div style="width:1px;background:#2a2a4a;margin:0 4px;"></div>`;
                topTags.forEach(([tag, count]) => {
                    html += `<div class="resumo-stat ${filtroTag === tag ? 'active' : ''}" data-filter="tag:${tag}"><span class="num">${count}</span> ${tag}</div>`;
                });
            }
            document.getElementById('resumoSemantico').innerHTML = html;
            document.querySelectorAll('.resumo-stat[data-filter]').forEach(el => {
                el.addEventListener('click', () => {
                    const f = el.dataset.filter;
                    if (f === 'all') { filtroCat = ''; filtroOrigem = ''; filtroTag = ''; }
                    else if (f.startsWith('cat:')) filtroCat = filtroCat === f.slice(4) ? '' : f.slice(4);
                    else if (f.startsWith('origem:')) filtroOrigem = filtroOrigem === f.slice(7) ? '' : f.slice(7);
                    else if (f.startsWith('tag:')) filtroTag = filtroTag === f.slice(4) ? '' : f.slice(4);
                    atualizarFiltros();
                });
            });
        }

        function renderFiltros() {
            document.getElementById('filterCategoria').innerHTML = [
                { val: '', label: 'Todas' },
                { val: 'tendencia', label: '🔥 Tendência' },
                { val: 'app', label: '🚀 App' },
                { val: 'negocio', label: '💼 Negócio' }
            ].map(c => `<button class="filter-btn ${filtroCat === c.val ? 'active' : ''}" data-cat="${c.val}">${c.label}</button>`).join('');

            document.getElementById('filterOrigem').innerHTML = [
                { val: '', label: 'Todas' },
                { val: 'global', label: '🌐 Global' },
                { val: 'brasil', label: '🇧🇷 Brasil' }
            ].map(o => `<button class="filter-btn ${filtroOrigem === o.val ? 'active' : ''}" data-origem="${o.val}">${o.label}</button>`).join('');

            document.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
                filtroCat = filtroCat === btn.dataset.cat ? '' : btn.dataset.cat;
                atualizarFiltros();
            }));
            document.querySelectorAll('[data-origem]').forEach(btn => btn.addEventListener('click', () => {
                filtroOrigem = filtroOrigem === btn.dataset.origem ? '' : btn.dataset.origem;
                atualizarFiltros();
            }));

            const btnOrdenar = document.getElementById('btnOrdenar');
            btnOrdenar.addEventListener('click', () => {
                ordenacao = ordenacao === 'default' ? 'calor' : 'default';
                btnOrdenar.classList.toggle('active', ordenacao === 'calor');
                btnOrdenar.textContent = ordenacao === 'calor' ? '↺ Limpar ordenação' : '🔥 Ordenar por calor';
                if (ordenacao === 'calor') {
                    ordenarCards();
                } else {
                    location.reload();
                }
            });
        }

        function renderCard(item) {
            let metaHtml = '';
            if (item.stars) {
                metaHtml = `<span class="card-meta-item">⭐ <span class="vol">${item.stars}</span></span>` + (item.forks ? `<span class="sep">·</span><span class="card-meta-item">🍴 <span class="vol">${item.forks}</span></span>` : '');
            } else if (item.volume) {
                metaHtml = `<span class="card-meta-item">🔊 <span class="vol">${item.volume}</span></span>` + (item.crescimento ? `<span class="sep">·</span><span class="card-meta-item">📈 <span class="growth">${item.crescimento}</span></span>` : '');
            }
            metaHtml += `<span class="sep">·</span><span class="card-meta-item">${item.origem === 'brasil' ? '🇧🇷' : '🌐'}</span>`;

            const tagsHtml = (item.tags || []).slice(0, 3).map(t => `<span class="card-tag">${t}</span>`).join('');
            const fonteHtml = item.fonte ? `<span class="card-tag origem-tag">${item.fonte}</span>` : '';
            const shortDesc = item.descricao.length > 120 ? item.descricao.slice(0, 120) + '…' : item.descricao;

            return `<div class="card" data-categoria="${item.categoria}" data-origem="${item.origem}" data-tags="${(item.tags || []).join(',')}" data-title="${item.titulo}">
                <div class="card-header">
                    <div class="card-title">${item.titulo}</div>
                    <div class="card-badge">${item.badge}</div>
                </div>
                <div class="card-meta-row">${metaHtml} ${tagsHtml} ${fonteHtml}</div>
                <div class="card-desc">${shortDesc}</div>
                <a class="card-link" href="${gerarUrl(item)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 Ver mais detalhes →</a>
            </div>`;
        }

        function atualizarFiltros() {
            document.querySelectorAll('[data-cat]').forEach(btn => btn.classList.toggle('active', filtroCat === btn.dataset.cat));
            document.querySelectorAll('[data-origem]').forEach(btn => btn.classList.toggle('active', filtroOrigem === btn.dataset.origem));
            document.querySelectorAll('.resumo-stat').forEach(el => {
                const f = el.dataset.filter;
                let active = f === 'all' ? !filtroCat && !filtroOrigem && !filtroTag
                    : f.startsWith('cat:') ? filtroCat === f.slice(4)
                    : f.startsWith('origem:') ? filtroOrigem === f.slice(7)
                    : f.startsWith('tag:') ? filtroTag === f.slice(4) : false;
                el.classList.toggle('active', active);
            });
            const cards = document.querySelectorAll('.card');
            let visiveis = 0;
            cards.forEach(c => {
                const match = (!filtroCat || c.dataset.categoria === filtroCat) && (!filtroOrigem || c.dataset.origem === filtroOrigem) && (!filtroTag || c.dataset.tags.split(',').includes(filtroTag));
                c.classList.toggle('hidden', !match);
                if (match) visiveis++;
            });
            document.getElementById('pageMeta').textContent = `${visiveis} de ${dados.length} entradas | Atualizado: ${new Date().toLocaleString('pt-BR')}`;
        }

        function carregarDados() {
            fetch('dados.json').then(r => r.json()).then(data => {
                dados = data;
                renderResumoSemantico();
                renderFiltros();
                const grid = document.getElementById('cardsGrid');
                grid.innerHTML = dados.map(renderCard).join('');
                document.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', e => { if (e.target.tag !== 'A') card.classList.toggle('expanded'); });
                });
                if (dados.length <= 3) document.querySelectorAll('.card').forEach(c => c.classList.add('expanded'));
                atualizarFiltros();
            }).catch(err => {
                document.getElementById('cardsGrid').innerHTML = `<div class="empty-state">Erro: ${err.message}</div>`;
            });
        }

        carregarDados();
    </script>
</body>
</html>
