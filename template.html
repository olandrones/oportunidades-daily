<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades Diárias — Lyriane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #2a2a4a; margin-bottom: 30px; }
        h1 { color: #7c3aed; font-size: 2em; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 0.9em; }
        .filters { background: #1a1a2e; padding: 20px; border-radius: 12px; margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 10px 15px; border: 1px solid #2a2a4a; border-radius: 8px; background: #0f0f1a; color: #fff; font-size: 0.9em; }
        .filters input { flex: 1; min-width: 200px; }
        .filters select { min-width: 150px; }
        .filters button { padding: 10px 15px; background: #2a2a4a; color: #fff; border: 1px solid #7c3aed; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85em; }
        .filters button:hover { background: #7c3aed; }
        .filters button.active { background: #7c3aed; border-color: #a78bfa; }
        .filters .sort-group { display: flex; gap: 5px; align-items: center; margin-left: 10px; }
        .filters .sort-group span { color: #888; font-size: 0.8em; margin-right: 5px; }
        .meta-info { color: #666; font-size: 0.85em; margin-bottom: 20px; }
        .section { margin-bottom: 40px; }
        .section-title { display: flex; align-items: center; gap: 10px; font-size: 1.4em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2a2a4a; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a4a; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #7c3aed; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-title { font-size: 1.1em; font-weight: 700; color: #fff; }
        .card-badge { font-size: 0.75em; padding: 4px 10px; border-radius: 20px; background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; }
        .card-meta { font-size: 0.8em; color: #666; margin-bottom: 10px; display: flex; gap: 15px; flex-wrap: wrap; }
        .card-meta span { display: flex; align-items: center; gap: 4px; }
        .card-desc { color: #aaa; line-height: 1.6; font-size: 0.95em; }
        .card-tags { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 0.75em; padding: 3px 10px; border-radius: 6px; background: #2a2a4a; color: #888; }
        .tag.origem { background: #3b82f620; color: #60a5fa; border: 1px solid #3b82f640; }
        .tag.categoria { background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; }
        .vol { font-weight: 700; color: #10b981; }
        .growth { color: #f59e0b; font-weight: 600; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        @media (max-width: 600px) { .filters { flex-direction: column; } .card-header { flex-direction: column; gap: 10px; } .sort-group { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Oportunidades Diárias</h1>
            <p class="subtitle">Relatório automático de tendências e oportunidades — atualizado 3x ao dia</p>
        </header>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar por termo..." onkeyup="filtrar()">
            <select id="categoriaFilter" onchange="filtrar()">
                <option value="">Todas Categorias</option>
                <option value="tendencia">🔥 Tendência</option>
                <option value="app">🚀 App/Produto</option>
                <option value="negocio">💼 Oportunidade</option>
            </select>
            <select id="origemFilter" onchange="filtrar()">
                <option value="">Todas Origens</option>
                <option value="global">Global</option>
                <option value="brasil">🇧🇷 Brasil</option>
            </select>
            <button onclick="limparFiltros()">Limpar</button>
            <div class="sort-group">
                <span>Ordenar:</span>
                <button onclick="ordenar('crescimento', 'desc')" id="btn-ord-cresc">↑ Crescimento</button>
                <button onclick="ordenar('crescimento', 'asc')" id="btn-ord-cresc-asc">↓ Crescimento</button>
                <button onclick="ordenar('volume', 'desc')" id="btn-ord-vol">↑ Volume</button>
                <button onclick="ordenar('volume', 'asc')" id="btn-ord-vol-asc">↓ Volume</button>
                <button onclick="ordenar('data', 'desc')" id="btn-ord-data">↑ Data</button>
                <button onclick="ordenar('data', 'asc')" id="btn-ord-data-asc">↓ Data</button>
            </div>
        </div>

        <div class="meta-info" id="metaInfo">Carregando...</div>

        <div class="section">
            <div class="section-title">📋 Todas as Oportunidades</div>
            <div id="cardsContainer"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentSort = { field: null, dir: null };

        function parseVolume(v) {
            if (!v) return 0;
            v = v.toString().replace(/[,.\s]/g, '');
            if (v.endsWith('K')) return parseFloat(v) * 1000;
            if (v.endsWith('M')) return parseFloat(v) * 1000000;
            return parseFloat(v) || 0;
        }

        function parseGrowth(v) {
            if (!v) return 0;
            v = v.toString().replace(/[^0-9.]/g, '');
            return parseFloat(v) || 0;
        }

        function parseDate(v) {
            if (!v) return 0;
            const parts = v.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
            if (parts) {
                return new Date(parts[3], parts[2]-1, parts[1], parts[4], parts[5]).getTime();
            }
            return 0;
        }

        function renderCard(item) {
            const tags = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
            const catBadge = item.categoria ? `<span class="tag categoria">${item.categoria}</span>` : '';
            const origBadge = item.origem ? `<span class="tag origem">${item.origem === 'brasil' ? '🇧🇷 Brasil' : '🌐 Global'}</span>` : '';
            return `<div class="card" data-categoria="${item.categoria || ''}" data-origem="${item.origem || ''}" data-volume="${parseVolume(item.volume)}" data-crescimento="${parseGrowth(item.crescimento)}" data-data="${parseDate(item.data_publicacao)}">
                <div class="card-header">
                    <div class="card-title">${item.titulo || ''}</div>
                    <div class="card-badge">${item.badge || ''}</div>
                </div>
                <div class="card-meta">
                    ${item.volume ? `<span class="vol">📊 ${item.volume}</span>` : ''}
                    ${item.crescimento ? `<span class="growth">🚀 ${item.crescimento}</span>` : ''}
                    ${item.fonte ? `<span>📌 ${item.fonte}</span>` : ''}
                    ${item.data_publicacao ? `<span>📅 ${item.data_publicacao}</span>` : ''}
                </div>
                <div class="card-desc">${item.descricao || ''}</div>
                <div class="card-tags">${catBadge}${origBadge}${tags}</div>
            </div>`;
        }

        function renderAll() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = allData.map(renderCard).join('');
            filtrar();
        }

        function filtrar() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoriaFilter').value;
            const orig = document.getElementById('origemFilter').value;
            const cards = document.querySelectorAll('#cardsContainer .card');
            let visiveis = 0;
            cards.forEach(c => {
                const texto = c.textContent.toLowerCase();
                const cats = c.dataset.categoria || '';
                const ors = c.dataset.origem || '';
                const mostrar = texto.includes(termo) && (cat === '' || cats === cat) && (orig === '' || ors === orig);
                c.style.display = mostrar ? 'block' : 'none';
                if (mostrar) visiveis++;
            });
            const dataAtual = allData.length > 0 ? (allData[0].data_publicacao || 'N/A') : 'N/A';
            document.getElementById('metaInfo').textContent = `${visiveis} entrada(s) encontrada(s) | Dados de: ${dataAtual}`;
        }

        function limparFiltros() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoriaFilter').value = '';
            document.getElementById('origemFilter').value = '';
            filtrar();
        }

        function ordenar(campo, direcao) {
            currentSort = { field: campo, dir: direcao };
            document.querySelectorAll('.sort-group button').forEach(b => b.classList.remove('active'));
            const btnId = direcao === 'desc' ? `btn-ord-${campo}` : `btn-ord-${campo}-${direcao}`;
            const btn = document.getElementById(btnId);
            if (btn) btn.classList.add('active');

            allData.sort((a, b) => {
                let valA, valB;
                if (campo === 'volume') {
                    valA = parseVolume(a.volume);
                    valB = parseVolume(b.volume);
                } else if (campo === 'crescimento') {
                    valA = parseGrowth(a.crescimento);
                    valB = parseGrowth(b.crescimento);
                } else if (campo === 'data') {
                    valA = parseDate(a.data_publicacao);
                    valB = parseDate(b.data_publicacao);
                }
                if (direcao === 'desc') return valB - valA;
                return valA - valB;
            });
            renderAll();
        }

        async function loadData() {
            try {
                const resp = await fetch('dados.json');
                allData = await resp.json();
                renderAll();
            } catch (e) {
                document.getElementById('metaInfo').textContent = 'Erro ao carregar dados: ' + e.message;
            }
        }

        loadData();
    </script>
</body>
</html>
